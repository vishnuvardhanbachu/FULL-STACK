version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/subscription-app
      - JWT_SECRET=supersecretjwtkeythatshouldbechanged
      - STRIPE_SECRET_KEY=sk_test_PLACEHOLDER
      - STRIPE_WEBHOOK_SECRET=whsec_PLACEHOLDER
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
